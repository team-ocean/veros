[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']


[tool.pytest.ini_options]
testpaths = [
    "test",
]


[build-system]
# Use the oldest FFI headers available for each supported Python ABI.
requires = [
    "setuptools>=84.2.0", "wheel", "cython",
    "jaxlib==0.5.0; python_version < '3.14'",
    "jaxlib==0.7.2; python_version >= '3.14'",
]
build-backend = "setuptools.build_meta"
