[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "veros"
dynamic = ["version"]
description = "The versatile ocean simulator, in pure Python, powered by JAX."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dion Häfner", email = "mail@dionhaefner.de" }]
keywords = ["oceanography", "python", "parallel", "numpy", "multi-core", "geophysics", "ocean-model", "mpi4py", "jax"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
dependencies = [
    "click",
    "entrypoints",
    "requests>=2.18",
    "numpy>=1.13",
    "scipy",
    "h5netcdf",
    "h5py",
    "pillow",
    "loguru",
    "tqdm",
]

[project.optional-dependencies]
jax = ["jax>=0.5.0", "jaxlib>=0.5.0"]
jax-mpi = ["veros[jax]", "mpi4py>=4.1", "mpi4jax==0.9.1.post2"]
# pytest 9.2 breaks pytest-forked (https://github.com/pytest-dev/pytest-forked/issues/113)
test = ["pytest<9.2", "pytest-cov", "pytest-forked", "xarray"]

[project.urls]
Homepage = "https://veros.readthedocs.io"

[project.scripts]
veros = "veros.cli.veros:cli"
veros-run = "veros.cli.veros_run:cli"
veros-copy-setup = "veros.cli.veros_copy_setup:cli"
veros-resubmit = "veros.cli.veros_resubmit:cli"
veros-create-mask = "veros.cli.veros_create_mask:cli"

[project.entry-points."veros.setup_dirs"]
base = "veros.setups"

[tool.hatch.version]
source = "vcs"
fallback-version = "0+unknown"

[tool.hatch.build.hooks.vcs]
version-file = "veros/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/veros",
    "/test",
    "/CMakeLists.txt",
    "/hatch_build.py",
    "/requirements.txt",
    "/requirements_jax.txt",
]

[tool.hatch.build.targets.wheel]
packages = ["veros"]
exclude = ["/veros/core/special/*.so", "/veros/core/special/*.pyd"]

[tool.hatch.build.targets.wheel.hooks.custom]
# Use the oldest FFI headers available for each supported Python ABI.
dependencies = [
    "cmake>=3.24",
    "nanobind>=2.10",
    "ninja; sys_platform != 'win32'",
    "jaxlib==0.5.0; python_version < '3.14'",
    "jaxlib==0.7.2; python_version >= '3.14'",
]

[tool.cibuildwheel]
# Build on 3.12 and reuse the same wheel when testing on 3.14.
build = "cp31{2,4}-{manylinux,macosx}_*"
environment = { VEROS_BUILD_ABI3 = "1" }
test-command = """
veros --version &&
python -c "from veros.core.special.tdma_cpu_ import cpu_ffi_targets; assert sorted(cpu_ffi_targets) == ['tdma_cpu_double', 'tdma_cpu_float']"
"""

[tool.cibuildwheel.macos]
# JAX supplies the build headers through a native Apple Silicon jaxlib wheel.
archs = ["universal2"]
inherit.environment = "append"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0", CMAKE_OSX_ARCHITECTURES = "arm64;x86_64", _PYTHON_HOST_PLATFORM = "macosx-11.0-universal2" }

[tool.ruff]
line-length = 120
extend-exclude = ["doc", "veros/_version.py"]


[tool.pytest.ini_options]
testpaths = [
    "test",
]
