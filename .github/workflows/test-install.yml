name: Test installation

on:
  pull_request:

  push:
    branches:
      - main

jobs:
  test-install:
    name: Test pip install

    defaults:
      run:
        shell: bash {0}

    strategy:
      fail-fast: false

      matrix:
          os: [ubuntu-latest, macos-latest, windows-latest]
          python-version: ["3.10", "3.14"]
          nocc: [false]

          include:
            # also test whether installation without C compiler works
            - os: ubuntu-latest
              python-version: "3.10"
              nocc: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CUDA
        if: runner.os == 'Linux' && !matrix.nocc
        run: |
          sudo apt-get update
          sudo apt-get install nvidia-cuda-toolkit

      - name: Test installing Veros
        run: |
          if ${{ matrix.nocc }}; then export CC=foobar; fi
          python -m pip install .

      - name: Install editable Veros with JAX
        if: ${{ !matrix.nocc }}
        run: |
          export VEROS_REQUIRE_CYTHON_EXT=1
          if [ ${{ runner.os }} = "Linux" ]; then
            export VEROS_REQUIRE_CUDA_EXT=1
          fi
          python -m pip install -e '.[jax]'

      - name: Import CPU TDMA extension
        if: ${{ !matrix.nocc }}
        run: python -c "from veros.core.special.tdma_cython_ import cpu_ffi_targets"

      - name: Import CUDA TDMA extension
        if: runner.os == 'Linux' && !matrix.nocc
        run: python -c "from veros.core.special.tdma_cuda_ import gpu_ffi_targets"
